name: Elixir CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  test:
    name: Test (Elixir ${{ matrix.elixir }} / OTP ${{ matrix.otp }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - elixir: '1.17'
            otp: '27'
          - elixir: '1.18'
            otp: '28'
          - elixir: '1.19'
            otp: '28'
          - elixir: '1.20'
            otp: '29'
    env:
      MIX_ENV: test
    steps:
    - uses: actions/checkout@v4
    - name: Set up Elixir
      uses: erlef/setup-beam@v1
      with:
        elixir-version: ${{ matrix.elixir }}
        otp-version: ${{ matrix.otp }}
    - name: Restore dependencies cache
      uses: actions/cache@v4
      with:
        path: deps
        key: ${{ runner.os }}-${{ matrix.otp }}-${{ matrix.elixir }}-mix-${{ hashFiles('**/mix.lock') }}
        restore-keys: ${{ runner.os }}-${{ matrix.otp }}-${{ matrix.elixir }}-mix-
    - name: Install dependencies
      run: mix deps.get --only test
    - name: Compile
      run: mix compile --warnings-as-errors
    - name: Run tests
      run: mix test

  epubcheck:
    name: Validate output with EPUBCheck
    runs-on: ubuntu-latest
    env:
      MIX_ENV: test
      EPUBCHECK_VERSION: '5.3.0'
    steps:
    - uses: actions/checkout@v4
    - name: Set up Elixir
      uses: erlef/setup-beam@v1
      with:
        elixir-version: '1.20'
        otp-version: '29'
    - name: Set up Java
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '21'
    - name: Cache EPUBCheck
      id: epubcheck-cache
      uses: actions/cache@v4
      with:
        path: epubcheck-${{ env.EPUBCHECK_VERSION }}
        key: epubcheck-${{ env.EPUBCHECK_VERSION }}
    - name: Download EPUBCheck
      if: steps.epubcheck-cache.outputs.cache-hit != 'true'
      run: |
        curl -sSL -o epubcheck.zip "https://github.com/w3c/epubcheck/releases/download/v${EPUBCHECK_VERSION}/epubcheck-${EPUBCHECK_VERSION}.zip"
        unzip -q epubcheck.zip
    - name: Restore dependencies cache
      uses: actions/cache@v4
      with:
        path: deps
        key: ${{ runner.os }}-epubcheck-mix-${{ hashFiles('**/mix.lock') }}
        restore-keys: ${{ runner.os }}-epubcheck-mix-
    - name: Install dependencies
      run: mix deps.get --only test
    - name: Validate generated EPUBs
      run: mix test --only epubcheck
      env:
        EPUBCHECK_JAR: ${{ github.workspace }}/epubcheck-${{ env.EPUBCHECK_VERSION }}/epubcheck.jar

  lint:
    name: Lint and static analysis
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    # Keep the lint Elixir version in sync with .tool-versions: the formatter
    # output differs across Elixir versions.
    - name: Set up Elixir
      id: beam
      uses: erlef/setup-beam@v1
      with:
        elixir-version: '1.20'
        otp-version: '29'
    - name: Restore dependencies cache
      uses: actions/cache@v4
      with:
        path: deps
        key: ${{ runner.os }}-lint-mix-${{ hashFiles('**/mix.lock') }}
        restore-keys: ${{ runner.os }}-lint-mix-
    - name: Install dependencies
      run: mix deps.get
    - name: Check formatting
      run: mix format --check-formatted
    - name: Check unused dependencies
      run: mix deps.unlock --check-unused
    - name: Check for retired dependencies
      run: mix hex.audit
    - name: Run Credo
      run: mix credo --strict
    - name: Restore PLT cache
      uses: actions/cache@v4
      with:
        path: _build/dev/*.plt*
        key: ${{ runner.os }}-plt-${{ steps.beam.outputs.otp-version }}-${{ steps.beam.outputs.elixir-version }}-${{ hashFiles('**/mix.lock') }}
        restore-keys: ${{ runner.os }}-plt-${{ steps.beam.outputs.otp-version }}-${{ steps.beam.outputs.elixir-version }}-
    - name: Run Dialyzer
      run: mix dialyzer
